[package]
name = "svg-trace-mod2"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "svg_trace.mod2 - bitmap to SVG vectorizer core for AviUtl2"

[lib]
name = "svg_trace"
crate-type = ["cdylib"]

[dependencies]
aviutl2 = "0.47"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
color_quant = "1.1"
resvg = "0.47.0"
vtracer = "0.6.5"
visioncortex = "0.8"
